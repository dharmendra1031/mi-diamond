name: Verify Michael Jewellery Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-michael-release.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://jeafuafahcylgooeapkj.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_nHxcbekyzVCNCFl28a3hhw_TumLosqY
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SITE_NAME: Michael Jewellery
      NEXT_PUBLIC_SITE_TAGLINE: Fine Jewellery · Kuwait
      NEXT_PUBLIC_WHATSAPP_NUMBER: 96597850983
      NEXT_PUBLIC_INSTAGRAM: michael.jewellerykwt
      NEXT_PUBLIC_PHONE: +965 2266 1269
      NEXT_PUBLIC_MOBILE: +965 9785 0983
      NEXT_PUBLIC_ADDRESS: Hawalli, Ibn Khaldoon St., Al-Haddad Complex, Shop 3, Kuwait
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Production dependency audit
        continue-on-error: true
        run: npm audit --omit=dev
      - name: Start production server
        run: |
          npm start > /tmp/michael-jewellery.log 2>&1 &
          echo $! > /tmp/michael-jewellery.pid
          sleep 6
      - name: Smoke test public catalogue
        run: |
          set -e
          for path in / /products /about /contact /privacy /admin/login; do
            code=$(curl --max-time 20 -sS -o /tmp/page.html -w "%{http_code}" "http://127.0.0.1:3000$path")
            echo "$path -> $code"
            test "$code" = "200"
          done
          curl --max-time 20 -sS http://127.0.0.1:3000/ | grep -q "Michael Jewellery"
      - name: Verify disabled legacy routes redirect
        run: |
          set -e
          for path in /cart /wishlist /order /login /register /faq /shipping-returns /admin/orders; do
            code=$(curl --max-time 20 -sS -o /dev/null -w "%{http_code}" "http://127.0.0.1:3000$path")
            echo "$path -> $code"
            case "$code" in
              301|302|303|307|308) ;;
              *) echo "Expected redirect for $path"; exit 1;;
            esac
          done
      - name: Print server log
        if: always()
        run: cat /tmp/michael-jewellery.log || true

# Verification rerun after removing legacy cart/wishlist/order runtime dependencies.
